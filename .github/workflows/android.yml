name: Compilar APK ESCANA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Descomprimir proyecto
      run: |
        unzip -o Escana.zip -d .
        # Ajustar por si los archivos quedaron dentro de una subcarpeta
        if [ -d "Escana" ]; then
          mv Escana/* . || true
        fi

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Dar permisos a Gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          gradle wrapper
          chmod +x gradlew
        fi

    - name: Compilar APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: ESCANA-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
